name: Echo 123

on:
  push:              # chạy khi push code
  workflow_dispatch: # cho phép bấm chạy tay trên GitHub
    inputs:
      org:
        description: "Tên tổ chức (để trống = tổ chức hiện tại)"
        required: false
        default: ""

env:
  ORG: ${{ inputs.org || github.repository_owner }}

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: In ra 123
        run: echo 123

      - name: Lấy tổ chức hiện tại
        run: |
          echo "Tổ chức: $ORG"
          echo "Repo: ${{ github.repository }}"
